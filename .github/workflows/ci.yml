name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unused files, exports and dependencies; config in knip.json.
      - run: npm run lint
      - run: npm test

  corpus:
    # The gate that catches real regressions: it re-runs the parser and
    # detectors over pinned public transcripts and fails if any published count
    # drifts. It fetches two small MIT-licensed corpora itself, so it needs
    # network but no credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:corpus
